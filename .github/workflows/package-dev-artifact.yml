name: Package Development Node Artifact

on:
  workflow_dispatch:
    inputs:
      confirm_dev_artifact:
        description: Build a Development-only standalone artifact (does not deploy)
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dev-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/feat/web-ci-cd-dev' && inputs.confirm_dev_artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      RESPONSIVE_BASE_URL: http://127.0.0.1:3005
      RESPONSIVE_ARTIFACT_DIR: /tmp/arentzo-responsive-evidence
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require Development public configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing Actions Variable: NEXT_PUBLIC_SUPABASE_URL'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing Actions Variable: NEXT_PUBLIC_SUPABASE_ANON_KEY'; exit 1; }
          test -n "$NEXT_PUBLIC_SITE_URL" || { echo 'Missing Actions Variable: NEXT_PUBLIC_SITE_URL'; exit 1; }
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://astiltnwyoxtcisedcyx.supabase.co) ;;
            *) echo 'NEXT_PUBLIC_SUPABASE_URL must point to the approved Rental Dev project.'; exit 1 ;;
          esac
          case "$NEXT_PUBLIC_SITE_URL" in
            https://arentzo.com) echo 'NEXT_PUBLIC_SITE_URL must be the Development origin, not the production canonical URL.'; exit 1 ;;
            https://*) ;;
            *) echo 'NEXT_PUBLIC_SITE_URL must use HTTPS.'; exit 1 ;;
          esac

      - name: Reject privileged or unrecognized Supabase keys
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
          let isPublishable = key.startsWith('sb_publishable_');
          const parts = key.split('.');
          if (!isPublishable && parts.length === 3) {
            try {
              isPublishable = JSON.parse(Buffer.from(parts[1], 'base64url').toString()).role === 'anon';
            } catch {
              isPublishable = false;
            }
          }
          if (!isPublishable) {
            console.error('NEXT_PUBLIC_SUPABASE_ANON_KEY must be a Supabase publishable key or legacy anon JWT.');
            process.exit(1);
          }
          JS

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and unit tests
        run: |
          npm run lint
          npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build standalone Next.js server
        run: npm run build

      - name: Verify standalone server in responsive browser checks
        shell: bash
        run: |
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          find .next/standalone -maxdepth 1 -type f -name '.env*' -delete
          pushd .next/standalone >/dev/null
          HOSTNAME=127.0.0.1 PORT=3005 node server.js >"$RUNNER_TEMP/arentzo-next.log" 2>&1 &
          server_pid=$!
          popd >/dev/null
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3005/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3005/ >/dev/null
          npm run test:responsive

      - name: Create standalone Development package
        run: |
          tar -czf "arentzo-web-dev-${GITHUB_SHA}.tar.gz" -C .next/standalone .

      - name: Upload Development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arentzo-web-dev-${{ github.sha }}
          path: arentzo-web-dev-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
